<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>Rapid Fire Round Stopwatch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" id="timerApp" aria-label="Rapid Fire Round stopwatch">
      <div class="topline">
        <span class="event-label"></span>
        <span class="sound-state" id="soundState"></span>
      </div>

      <section class="timer-surface" id="timerSurface" tabindex="0" aria-label="Touch to start or pause the stopwatch">
        <header>
          <h1>Stopwatch</h1>
        </header>

        <div class="main-timer-block">
          <p class="timer-label">Main timer</p>
          <output class="main-time" id="mainTime" aria-live="off">00:00</output>
          <div class="status" id="status" role="status">READY</div>
        </div>

        <div class="sub-timer-block" id="subTimerBlock">
          <div class="sub-heading">
            <p class="timer-label">30 second timer</p>
            <span class="cycle-note" id="cycleNote">NEW CYCLE</span>
          </div>
          <output class="sub-time" id="subTime">00:00</output>
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        </div>

        <p class="touch-hint" id="touchHint">Touch anywhere to start</p>
      </section>

      <nav class="controls" aria-label="Stopwatch controls">
        <button class="primary-control" id="toggleButton" type="button">Start</button>
        <button id="resetButton" type="button">Reset</button>
        <button id="muteButton" type="button" aria-pressed="false">Mute</button>
        <button id="fullscreenButton" type="button">Fullscreen</button>
      </nav>
    </main>
    <script src="script.js"></script>
  </body>
</html>
